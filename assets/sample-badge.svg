<svg xmlns="http://www.w3.org/2000/svg" width="260" height="70" aria-label="pouyashahrdami's pulse — 96 bpm" role="img" viewBox="0 0 260 70"><style>@keyframes gp-thump{0%,30%{transform:scale(1)}15%{transform:scale(1.32)}}@keyframes gp-blink{50%{opacity:.25}}.gp-sweep{animation:gp-sweep 2.5s linear infinite}.gp-heart{animation:gp-thump .6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.gp-dot{animation:gp-blink 1.8s ease-in-out infinite}</style><defs><linearGradient id="gp-tg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".5" stop-color="#2FD4EE"/><stop offset="1" stop-color="#F26DB8"/></linearGradient><filter id="gp-glow" width="140%" height="180%" x="-20%" y="-40%"><feGaussianBlur result="b" stdDeviation="2"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="259" height="69" x=".5" y=".5" fill="#0B0819" stroke="rgba(139,92,246,0.10)" rx="12"/><text x="14" y="20" fill="#928DAD" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="10.5">@pouyashahrdami</text><circle cx="244" cy="16" r="4" fill="#8B5CF6" class="gp-dot"/><text x="14" y="48" fill="#8B5CF6" class="gp-heart" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="13">♥</text><text x="30" y="48" fill="#EDEBF6" font-family="ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="18" font-weight="700">96<tspan fill="#928DAD" dx="3" font-size="9" font-weight="400">bpm</tspan></text><path fill="none" stroke="url(#gp-tg)" stroke-width="1.4" d="M104 40 h20.3 h20.3 h20.3 h20.3 h20.3 h20.3 h4 l2 3 l4 -12.5 l4 20.5 l2 -8 h2.3" opacity=".22"/><path fill="none" stroke="url(#gp-tg)" stroke-dasharray="140 860" stroke-linecap="round" stroke-width="1.8" d="M104 40 h20.3 h20.3 h20.3 h20.3 h20.3 h20.3 h4 l2 3 l4 -12.5 l4 20.5 l2 -8 h2.3" class="gp-sweep" filter="url(#gp-glow)" pathLength="1000"/></svg>